name: Bootstrap first npm release

# npm cannot stage a brand-new package or attach a trusted publisher before the
# package exists. This workflow is intentionally one-use: after the first
# provenance-backed publish, remove it and its secret through a protected PR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact protected first release tag, for example v0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    steps:
      - name: Check out the first release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with provenance support
        run: npm install --global npm@11.17.0
      - name: Verify release tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-ref.mjs
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify source, tests, coverage, build and package allowlist
        run: npm run check
      - name: Publish the first immutable beta with provenance
        run: npm publish --provenance --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
